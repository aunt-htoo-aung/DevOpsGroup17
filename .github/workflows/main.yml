name: Workflow for Population Report System

on:
  push:
    branches:
      - master
      - develop
      - release
      - 'feature/**'
  pull_request:
    branches:
      - master
      - develop
      - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build with Maven
        run: mvn package
      - name: Run docker compose
        run: docker compose up --abort-on-container-exit

