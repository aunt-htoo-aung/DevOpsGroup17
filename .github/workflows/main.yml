name: Workflow for Population Report System

on:
  push:
    branches:
      - master
      - develop
      - release
      - 'feature/**'
  pull_request:
    branches:
      - master
      - develop
      - release

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run unit tests
        run: mvn test

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run integration tests
        run: mvn test-compile failsafe:integration-test failsafe:verify

  build:
    name: Build and Run Docker Compose
    needs: [unit-test, integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn package -DskipTests

      - name: Run docker compose
        run: docker compose up --abort-on-container-exit
